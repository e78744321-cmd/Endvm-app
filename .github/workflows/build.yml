
name: Build Endvm 2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP archive not found!"
            exit 1
          fi

          echo "Extracting: $ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | head -100

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found in ZIP!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" dist/Endvm2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Endvm2-APK
          path: dist/Endvm2.apk
          if-no-files-found: error
          
