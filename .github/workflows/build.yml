name: Build Endvm 2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

# Новый запуск отменяет предыдущий для той же ветки
concurrency:
  group: build-endvm2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Фиксируем версию образа: ubuntu-latest переезжает на новую Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Gradle 8.9 нужен как запасной вариант, если в проекте нет рабочего gradlew.
      # Если gradlew есть, сборка идёт на версии Gradle из проекта.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          set -u

          run_build() {
            echo "== Gradle-файлы в репозитории =="
            find . -maxdepth 4 \
              \( -name 'settings.gradle*' -o -name 'build.gradle*' -o -name 'gradlew' -o -name 'gradle-wrapper.*' \) \
              -not -path './.git/*' | sort
            echo "================================"

            # Ищем корень Gradle-проекта: сначала корень репозитория, потом подпапки
            PROJECT_DIR=""
            if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
              PROJECT_DIR="."
            else
              PROJECT_FILE="$(find . -maxdepth 3 -name 'settings.gradle*' -not -path './.git/*' | sort | head -n 1)"
              if [ -n "$PROJECT_FILE" ]; then
                PROJECT_DIR="$(dirname "$PROJECT_FILE")"
              fi
            fi

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: в репозитории нет settings.gradle или settings.gradle.kts, Gradle-проект не найден"
              return 1
            fi

            cd "$PROJECT_DIR"
            echo "Папка проекта: $(pwd)"

            if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
              # на случай Windows-переводов строк и потерянного бита исполнения
              sed -i 's/\r$//' gradlew
              chmod +x gradlew
              ./gradlew --no-daemon --stacktrace assembleDebug
            else
              echo "gradlew или gradle/wrapper/gradle-wrapper.jar отсутствует, использую Gradle 8.9"
              gradle --no-daemon --stacktrace assembleDebug
            fi
          }

          run_build 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          STATUS="${PIPESTATUS[0]}"

          # Итог показываем прямо на странице запуска (Summary)
          if [ "$STATUS" -ne 0 ]; then
            {
              echo "### Сборка упала (код $STATUS)"
              echo "Последние строки лога:"
              echo '```'
              tail -n 60 "$GITHUB_WORKSPACE/build.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$STATUS"

      # Путь не привязан к модулю app и к имени файла
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Endvm2-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: |
            build.log
            **/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
          
